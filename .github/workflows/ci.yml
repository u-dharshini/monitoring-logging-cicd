
name: Monitoring and Logging CI

on:
  push:
  pull_request:

jobs:
  monitoring-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint=promtool \
            -v "$GITHUB_WORKSPACE/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Start monitoring stack
        run: docker compose up -d

      - name: Check service health
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9090/-/healthy >/dev/null \
              && curl -fsS http://localhost:3100/ready >/dev/null \
              && curl -fsS http://localhost:3000/api/health >/dev/null; then
              echo "All services are healthy."
              exit 0
            fi

            echo "Waiting for services... attempt $i/30"
            sleep 5
          done

          echo "Service health checks failed."
          exit 1

      - name: Verify Prometheus targets
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 12); do
            if curl -fsSG \
              --data-urlencode 'query=up' \
              http://localhost:9090/api/v1/query \
              -o metrics.json; then

              if grep -q '"1"' metrics.json \
                && grep -q '"status":"success"' metrics.json; then
                echo "Prometheus returned successful query results."
                cat metrics.json
                exit 0
              fi
            fi

            echo "Waiting for Prometheus targets... attempt $i/12"
            sleep 5
          done

          echo "Prometheus target verification failed."
          cat metrics.json || true
          exit 1

      - name: Show diagnostic logs if failed
        if: failure()
        run: docker compose logs --no-color

      - name: Stop monitoring stack
        if: always()
        run: docker compose down
